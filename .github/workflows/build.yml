name: Build HeightMeter APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.5"

jobs:
  lint:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show environment info
        run: |
          echo "Java version:"
          java -version 2>&1
          echo "---"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "No platforms dir"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "No build-tools dir"

      - name: Run lint
        run: ./gradlew lint --no-daemon --stacktrace 2>&1 | tee /tmp/lint_output.log

      - name: Upload lint log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: /tmp/lint_output.log

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check compilation
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee /tmp/compile_output.log

      - name: Upload compile log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: /tmp/compile_output.log

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/test_output.log

      - name: Upload test logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test_output.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show environment info
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "No platforms dir"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "No build-tools dir"
          echo "--- Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build_output.log
          echo "=== APK OUTPUT DIR ==="
          find app/build/outputs -name "*.apk" 2>/dev/null
          echo "=== APK count ==="
          find app/build/outputs -name "*.apk" 2>/dev/null | wc -l

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_output.log

      - name: Upload APK (wildcard path)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heightmeter-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release-build:
    name: Build release APK (unsigned)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        continue-on-error: true
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/release_build.log

      - name: Find and upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heightmeter-release-apk
          path: app/build/outputs/apk/release/*.apk
